name: farmitra_nearby
description: Farmitra Nearby - local network chat and file sharing compatible with Farmitra Nearby for Windows.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  open_filex: ^4.6.0
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  flutter_local_notifications: ^17.2.1
  flutter_markdown: ^0.7.3
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  flutter_callkit_incoming: ^2.0.4
  flutter_webrtc: ^1.6.0
  archive: ^3.6.1
  flutter_riverpod: ^2.5.1
  share_plus: ^10.1.4
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10
  uuid: ^4.5.1

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/nearmitra.png"
  adaptive_icon_background: "#10B981"
  adaptive_icon_foreground: "assets/images/nearmitra.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
